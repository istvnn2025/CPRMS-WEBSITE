<!DOCTYPE html>
<html>
<head>
    <title>Check Supabase Config</title>
    <!-- Load Supabase FIRST -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Load your config SECOND -->
    <script src="supabase-config.js"></script>
</head>
<body>
    <h1>🔍 Checking Supabase Config</h1>
    <div id="result" style="font-size:1.2rem; padding:1rem; border-radius:8px;">Loading...</div>

    <script>
        const result = document.getElementById('result');

        // Check if functions exist
        console.log('=== CHECKING SUPABASE FUNCTIONS ===');
        console.log('typeof getUserByEmail:', typeof getUserByEmail);
        console.log('typeof createUser:', typeof createUser);
        console.log('typeof createProfile:', typeof createProfile);
        console.log('typeof updateUser:', typeof updateUser);
        console.log('typeof upsertActiveUser:', typeof upsertActiveUser);

        let html = '';

        if (typeof getUserByEmail === 'undefined') {
            html += `<p style="color:red;">❌ getUserByEmail is NOT defined!</p>`;
        } else {
            html += `<p style="color:green;">✅ getUserByEmail is defined! (${typeof getUserByEmail})</p>`;
        }

        if (typeof createUser === 'undefined') {
            html += `<p style="color:red;">❌ createUser is NOT defined!</p>`;
        } else {
            html += `<p style="color:green;">✅ createUser is defined! (${typeof createUser})</p>`;
        }

        if (typeof createProfile === 'undefined') {
            html += `<p style="color:red;">❌ createProfile is NOT defined!</p>`;
        } else {
            html += `<p style="color:green;">✅ createProfile is defined! (${typeof createProfile})</p>`;
        }

        if (typeof updateUser === 'undefined') {
            html += `<p style="color:red;">❌ updateUser is NOT defined!</p>`;
        } else {
            html += `<p style="color:green;">✅ updateUser is defined! (${typeof updateUser})</p>`;
        }

        if (typeof upsertActiveUser === 'undefined') {
            html += `<p style="color:red;">❌ upsertActiveUser is NOT defined!</p>`;
        } else {
            html += `<p style="color:green;">✅ upsertActiveUser is defined! (${typeof upsertActiveUser})</p>`;
        }

        // Check if supabase exists
        if (typeof supabase === 'undefined') {
            html += `<p style="color:red;">❌ supabase client is NOT defined!</p>`;
        } else {
            html += `<p style="color:green;">✅ supabase client exists!</p>`;
            if (typeof supabase.from === 'function') {
                html += `<p style="color:green;">✅ supabase.from is a function!</p>`;
            } else {
                html += `<p style="color:red;">❌ supabase.from is NOT a function!</p>`;
            }
        }

        // Try to test connection
        html += `<hr><h3>Testing Database Connection...</h3>`;

        if (typeof supabase !== 'undefined' && typeof supabase.from === 'function') {
            (async function() {
                try {
                    const { data, error } = await supabase
                        .from('users')
                        .select('*')
                        .limit(1);

                    if (error) {
                        html += `<p style="color:orange;">⚠️ Connection works but error: ${error.message}</p>`;
                        html += `<p>This might mean the 'users' table doesn't exist yet.</p>`;
                        html += `<p><small>Run the SQL code in Supabase SQL Editor first.</small></p>`;
                        result.innerHTML = html;
                        return;
                    }

                    html += `<p style="color:green;">✅ Successfully queried 'users' table!</p>`;
                    html += `<p>Users found: ${data ? data.length : 0}</p>`;
                    result.innerHTML = html;

                } catch (err) {
                    html += `<p style="color:red;">❌ Error: ${err.message}</p>`;
                    result.innerHTML = html;
                }
            })();
        } else {
            result.innerHTML = html;
        }

        // If all functions are missing
        if (typeof getUserByEmail === 'undefined' && 
            typeof createUser === 'undefined' &&
            typeof supabase === 'undefined') {
            html += `<hr><p style="color:red; font-weight:bold;">⚠️ supabase-config.js is NOT loading!</p>`;
            html += `<p>Possible issues:</p>`;
            html += `<ul>
                <li>supabase-config.js is not in the same folder</li>
                <li>File name is wrong (check spelling)</li>
                <li>There's a syntax error in supabase-config.js</li>
            </ul>`;
            result.innerHTML = html;
        }

        console.log('=== CHECK COMPLETE ===');
    </script>
</body>
</html>
