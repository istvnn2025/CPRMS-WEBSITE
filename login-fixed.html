<!DOCTYPE html>
<html>
<head>
    <title>Login - FIXED</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #b31b1b; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #8a1515; }
        .error { color: red; padding: 10px; background: #ffebee; border-radius: 5px; margin: 10px 0; }
        .success { color: green; padding: 10px; background: #e8f5e9; border-radius: 5px; margin: 10px 0; }
        .hidden { display: none; }
        h1 { color: #b31b1b; }
    </style>
</head>
<body>

    <h1>🔐 Login System</h1>
    <p id="status">Ready</p>

    <!-- LOGIN FORM -->
    <form id="loginForm">
        <input type="email" id="emailInput" placeholder="Enter your email" required />
        <input type="password" id="passwordInput" placeholder="Enter your password" required />
        <button type="submit" id="loginButton">🔑 Login</button>
    </form>

    <!-- CREATE ACCOUNT BUTTON -->
    <button onclick="showRegister()" style="background: #333; margin-top: 10px;">📝 Create Account</button>

    <!-- REGISTER FORM (HIDDEN) -->
    <div id="registerSection" style="display: none; margin-top: 20px;">
        <h3>Create Account</h3>
        <form id="registerForm">
            <input type="text" id="registerName" placeholder="Full name" required />
            <input type="email" id="registerEmail" placeholder="Email" required />
            <input type="password" id="registerPassword" placeholder="Password (min 6 chars)" required />
            <input type="password" id="registerConfirm" placeholder="Confirm password" required />
            <button type="submit" style="background: #28a745;">✅ Create Account</button>
        </form>
        <button onclick="hideRegister()" style="background: #666; margin-top: 5px;">← Back to Login</button>
    </div>

    <div id="result" style="margin-top: 15px;"></div>

    <script>
        // ============================================================
        // SUPABASE SETUP
        // ============================================================
        console.log('🚀 Script started!');

        const supabase = window.supabase.createClient(
            'https://aqrwojihqnooaxiytgmv.supabase.co',
            'sb_publishable_S1SjM1Gq-LxeCZks88QwgQ_rbXus_'
        );

        console.log('✅ Supabase client created');

        // ============================================================
        // DATABASE FUNCTIONS
        // ============================================================
        async function getUserByEmail(email) {
            console.log('🔍 Looking for user:', email);
            const { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('email', email)
                .single();
            if (error && error.code !== 'PGRST116') {
                console.error('❌ getUserByEmail error:', error);
                throw error;
            }
            console.log('👤 User found:', data);
            return data;
        }

        async function createUser(userData) {
            console.log('📝 Creating user:', userData.email);
            const { data, error } = await supabase
                .from('users')
                .insert([userData])
                .select();
            if (error) {
                console.error('❌ createUser error:', error);
                throw error;
            }
            console.log('✅ User created:', data);
            return data;
        }

        async function createProfile(profileData) {
            console.log('📝 Creating profile for:', profileData.email);
            const { data, error } = await supabase
                .from('profiles')
                .insert([profileData])
                .select();
            if (error) {
                console.error('❌ createProfile error:', error);
                throw error;
            }
            console.log('✅ Profile created:', data);
            return data;
        }

        console.log('✅ All functions ready');

        // ============================================================
        // SHOW/HIDE REGISTER
        // ============================================================
        function showRegister() {
            document.getElementById('registerSection').style.display = 'block';
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('status').textContent = 'Creating account...';
        }

        function hideRegister() {
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('status').textContent = 'Ready';
        }

        // ============================================================
        // LOGIN FORM - FIXED
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('🔵🔵🔵 LOGIN BUTTON CLICKED! 🔵🔵🔵');

            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const result = document.getElementById('result');

            result.innerHTML = '⏳ Checking...';
            result.className = '';

            console.log('📧 Email:', email);
            console.log('🔑 Password length:', password ? password.length : 0);

            if (!email || !password) {
                result.innerHTML = '❌ Please enter email and password.';
                result.className = 'error';
                return;
            }

            try {
                console.log('🔍 Calling getUserByEmail...');
                const user = await getUserByEmail(email);
                console.log('👤 User result:', user);

                if (!user) {
                    result.innerHTML = '❌ No account found. Please create an account first.';
                    result.className = 'error';
                    return;
                }

                console.log('🔐 Checking password...');
                if (user.password !== password) {
                    result.innerHTML = '❌ Incorrect password.';
                    result.className = 'error';
                    return;
                }

                console.log('✅✅✅ LOGIN SUCCESS! ✅✅✅');
                result.innerHTML = '✅ Login successful! Welcome, ' + user.name + '! Redirecting...';
                result.className = 'success';

                // Save session
                sessionStorage.setItem('userEmail', user.email);
                sessionStorage.setItem('userName', user.name);
                sessionStorage.setItem('userType', 'user');

                // Redirect after delay
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (err) {
                console.error('❌❌❌ LOGIN ERROR:', err);
                result.innerHTML = '❌ Error: ' + err.message;
                result.className = 'error';
            }
        });

        console.log('✅ Login form listener attached');

        // ============================================================
        // REGISTER FORM
        // ============================================================
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('🔵🔵🔵 REGISTER BUTTON CLICKED! 🔵🔵🔵');

            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerConfirm').value;
            const result = document.getElementById('result');

            result.innerHTML = '⏳ Creating account...';
            result.className = '';

            if (!name || !email || !password || !confirm) {
                result.innerHTML = '❌ Please complete all fields.';
                result.className = 'error';
                return;
            }

            if (!email.includes('@')) {
                result.innerHTML = '❌ Please enter a valid email address.';
                result.className = 'error';
                return;
            }

            if (password.length < 6) {
                result.innerHTML = '❌ Password must be at least 6 characters.';
                result.className = 'error';
                return;
            }

            if (password !== confirm) {
                result.innerHTML = '❌ Passwords do not match.';
                result.className = 'error';
                return;
            }

            try {
                // Check if user exists
                const existing = await getUserByEmail(email);
                if (existing) {
                    result.innerHTML = '❌ An account with this email already exists.';
                    result.className = 'error';
                    return;
                }

                // Create user
                await createUser({
                    email: email,
                    name: name,
                    password: password,
                    user_type: 'user'
                });

                // Create profile
                await createProfile({
                    email: email,
                    name: name,
                    user_type: 'Resident',
                    member_since: new Date().toISOString()
                });

                result.innerHTML = '✅ Account created successfully! Please log in.';
                result.className = 'success';

                // Reset form and hide register
                this.reset();
                setTimeout(() => {
                    hideRegister();
                    document.getElementById('emailInput').value = email;
                    document.getElementById('result').innerHTML = '';
                }, 1500);

            } catch (err) {
                console.error('❌❌❌ REGISTER ERROR:', err);
                result.innerHTML = '❌ Error: ' + err.message;
                result.className = 'error';
            }
        });

        console.log('✅ Register form listener attached');
        console.log('🚀 Ready! Try logging in now.');
        console.log('💡 Click the Login button and watch the console!');
    </script>
</body>
</html>
