<!DOCTYPE html>
<html>
<head>
    <title>Supabase Final Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Supabase Final Test</h1>
    <div id="result">Loading...</div>
    
    <script>
        // ===== STEP 1: Check if Supabase loaded =====
        console.log('Step 1: Checking Supabase library...');
        console.log('window.supabase:', window.supabase);
        
        if (!window.supabase) {
            document.getElementById('result').innerHTML = `
                <p style="color:red;">❌ Supabase library did not load!</p>
                <p>Check your internet connection and try again.</p>
            `;
            throw new Error('Supabase library not loaded');
        }
        
        // ===== STEP 2: Create the client =====
        console.log('Step 2: Creating Supabase client...');
        
        const SUPABASE_URL = 'https://aqrwojihqnooaxiytgmv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_S1SjM1Gq-LxeCZks88QwgQ_rbXus_';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        console.log('Supabase client created:', supabase);
        console.log('supabase.from type:', typeof supabase.from);
        
        if (typeof supabase.from !== 'function') {
            document.getElementById('result').innerHTML = `
                <p style="color:red;">❌ supabase.from is not a function!</p>
                <p>The client was not created correctly.</p>
            `;
            throw new Error('supabase.from is not a function');
        }
        
        // ===== STEP 3: Test the connection =====
        console.log('Step 3: Testing connection...');
        document.getElementById('result').innerHTML = 'Testing connection to Supabase...';
        
        async function testConnection() {
            try {
                console.log('Attempting to query users table...');
                
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .limit(5);
                
                if (error) {
                    console.error('Query error:', error);
                    document.getElementById('result').innerHTML = `
                        <p style="color:orange;">⚠️ Connection works but got error:</p>
                        <p><strong>${error.message}</strong></p>
                        <p>This might mean the 'users' table doesn't exist yet.</p>
                        <p>Run the SQL code in Supabase SQL Editor first.</p>
                    `;
                    return;
                }
                
                console.log('Query successful! Data:', data);
                document.getElementById('result').innerHTML = `
                    <p style="color:green;">✅ Connection Successful!</p>
                    <p>Users found: ${data ? data.length : 0}</p>
                    <pre style="background:#f5f5f5;padding:10px;border-radius:5px;overflow:auto;max-height:200px;">${JSON.stringify(data, null, 2)}</pre>
                `;
                
            } catch (err) {
                console.error('Unexpected error:', err);
                document.getElementById('result').innerHTML = `
                    <p style="color:red;">❌ Error: ${err.message}</p>
                `;
            }
        }
        
        testConnection();
    </script>
</body>
</html>
